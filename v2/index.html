<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kevin Anrico — The Work, in Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* VOICE: a long-form museum story — calm narration, loud chapter breaks
   IDEA: the portfolio as a monograph told in chapters, like an archive exhibition online
   PICTURE: full-bleed colour fields with giant stretching type and a pen line that draws itself
   COLOUR and TYPE: one flat field per chapter (signal orange, field green, ultramarine, ink) on paper; Archivo (width axis) + Newsreader + Plex Mono
   LAYOUT: pinned chapter openers, cinematic prologue, editorial spreads, a viewer for each project */
:root{--paper:#F1EEE7;--ink:#111;--mut:#6F6A62;--line:rgba(17,17,17,.18);--c1:#FF6A1F;--c2:#2FA84F;--c3:#3B6CF6;--c4:#141414;
--disp:"Archivo",Impact,sans-serif;--ser:"Newsreader",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--pad:max(3.2vw,18px);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;min-width:0;margin:0;padding:0}
html{overflow-x:clip;scroll-padding-top:70px}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
body{background:var(--paper);color:var(--ink);font:18px/1.55 var(--ser);-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mono{font:500 12px/1.35 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.br{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:.5em;min-height:36px;white-space:nowrap}
.br::before{content:"["}.br::after{content:"]"}
.br:hover span{text-decoration:underline;text-underline-offset:3px}
.disp{font-family:var(--disp);font-weight:900;text-transform:uppercase;line-height:.8;letter-spacing:-.01em;white-space:nowrap;font-stretch:125%}
.fit{display:block;width:max-content;max-width:none}

/* loader */
#loader{position:fixed;inset:0;z-index:200;background:var(--c1);display:grid;place-items:center;transition:clip-path 1.1s var(--ease);clip-path:inset(0)}
#loader.out{clip-path:inset(0 0 100% 0)}
#loader svg{width:min(70vw,620px);height:auto;overflow:visible}
#loader .mono{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#loader p{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(20px,2.4vw,30px);line-height:1.25;width:min(90vw,560px)}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:flex-start;padding:16px var(--pad);pointer-events:none;color:var(--hc,var(--ink));transition:color .4s}
.hdr>*{pointer-events:auto}
.hl{display:flex;gap:18px;align-items:flex-start}
.logo{font:600 21px/1 var(--disp);letter-spacing:-.02em;font-stretch:90%}
.chap{line-height:1.3;opacity:.85;min-width:150px}
.hr{display:flex;gap:18px}
.prog{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:60;background:transparent}
.prog i{display:block;height:100%;background:var(--hc,var(--ink));transform-origin:left;transform:scaleX(0)}

/* scribble */
.scrib{position:absolute;pointer-events:none;overflow:visible}
.scrib path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.pin{position:relative}
.stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#hero{height:220vh;background:var(--c1)}
#hero .stick{display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--pad) 3vh}
#hero .scrib{left:8vw;right:8vw;top:12vh;height:34vh;width:84vw}
.hmeta{display:grid;grid-template-columns:1fr minmax(0,360px);align-items:end;gap:24px;margin-bottom:2.4vh}
.hmeta p{font-size:clamp(17px,1.35vw,20px);line-height:1.4}
.htitle .fit{will-change:font-stretch}

/* prologue */
#story .stick{background:#000;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--ease)}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 6s linear}
.slide.on img{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05) 35%,rgba(0,0,0,.72))}
.cap{position:absolute;right:var(--pad);top:50%;width:min(420px,80vw);font-size:clamp(22px,2.1vw,32px);line-height:1.25;text-shadow:0 2px 24px rgba(0,0,0,.5);opacity:0;transform:translateY(calc(-50% + 24px));transition:opacity .9s var(--ease),transform .9s var(--ease)}
.cap.on{opacity:1;transform:translateY(-50%)}
.dots{position:absolute;left:var(--pad);bottom:28px;display:flex;gap:8px}
.dots i{width:26px;height:2px;background:rgba(255,255,255,.3)}.dots i.on{background:#fff}

/* chapter opener */
.chapter{height:190vh}
.chapter .stick{display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);background:var(--cc)}
.chapter .scrib{left:10vw;top:8vh;width:80vw;height:30vh}
.chapter .ctitle{position:relative;z-index:1}
.chapter .clabel{position:absolute;left:var(--pad);bottom:4vh;display:flex;gap:40px;flex-wrap:wrap}
.chapter .count{position:absolute;right:var(--pad);bottom:4vh;text-align:right}
.chapter.dark{color:var(--paper)}

/* project spread */
.proj{padding:clamp(70px,9vw,140px) var(--pad);border-top:1px solid var(--line);position:relative}
.proj .ptop{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 24px;align-items:end;margin-bottom:clamp(28px,3vw,44px)}
.pno{grid-column:1/span 2;font:900 clamp(56px,7vw,120px)/.8 var(--disp);font-stretch:62%;color:var(--cc)}
.pname{grid-column:3/span 10;font:900 clamp(44px,6.6vw,118px)/.84 var(--disp);font-stretch:112%;text-transform:uppercase;letter-spacing:-.015em}
.pmeta{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;border-top:1px solid var(--ink);padding-top:12px;margin-bottom:clamp(30px,4vw,60px)}
.pmeta div{grid-column:span 3}.pmeta div span{display:block;color:var(--mut);margin-bottom:4px}
.pbody{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.ptext{grid-column:1/span 4;position:sticky;top:90px}
.ptag{font-style:italic;font-size:clamp(24px,2.2vw,34px);line-height:1.15;margin-bottom:22px}
.drop{font-size:19px;line-height:1.6}
.drop::first-letter{float:left;font:900 5.2em/.78 var(--disp);font-stretch:125%;background:var(--cc);color:var(--ink);padding:.06em .08em 0;margin:.05em .12em 0 0}
.dark-ink .drop::first-letter{color:var(--paper)}
.ptext .br{margin-top:26px}
.pfig{grid-column:6/span 7}
.pfig figure{cursor:zoom-in;overflow:hidden;background:#e6e2d9}
.pfig figure img{width:100%;height:auto;transform:scale(1.06);transition:transform 1.6s var(--ease)}
.pfig figure.in img{transform:none}
.pfig figure:hover img{transform:scale(1.02)}
.pfig figure.clear{background:none;display:grid;place-items:center;padding:3vw 0}
.pfig figure.clear img{width:auto;max-height:620px;transform:none}
.figcap{display:flex;justify-content:space-between;gap:16px;margin:12px 0 0;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.thumbs button{aspect-ratio:4/3;overflow:hidden;background:#e6e2d9;position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease),opacity .3s}
.thumbs button:hover img{transform:scale(1.05)}
.thumbs .more{position:absolute;inset:0;background:rgba(17,17,17,.72);color:var(--paper);display:grid;place-items:center}
.proj:nth-of-type(even) .ptext{grid-column:9/span 4;grid-row:1}
.proj:nth-of-type(even) .pfig{grid-column:1/span 7;grid-row:1}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

/* unreleased film */
#unrel-film{height:var(--fh,300vh);background:var(--c4);color:var(--paper)}
#unrel-film .stick{display:flex;flex-direction:column;justify-content:center;gap:28px}
.film{display:flex;gap:18px;padding:0 var(--pad);width:max-content;will-change:transform}
.film figure{width:min(56vw,860px);flex:none;cursor:zoom-in}
.film img{width:100%;aspect-ratio:16/9;object-fit:cover}
.film figcaption{display:flex;justify-content:space-between;margin-top:10px;opacity:.6}
.fhead{padding:0 var(--pad);display:flex;justify-content:space-between;align-items:end;gap:20px}
.fhead p{font-style:italic;font-size:clamp(20px,1.8vw,26px);max-width:420px}

/* epilogue */
.ep{padding:clamp(80px,10vw,160px) var(--pad)}
.agrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.aphoto{grid-column:1/span 4}
.aphoto img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.atext{grid-column:6/span 7}
.big{font-size:clamp(30px,3.4vw,54px);line-height:1.12;letter-spacing:-.01em}
.big em{font-style:italic}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:56px;border-top:1px solid var(--ink);padding-top:14px}
.facts b{display:block;font:900 clamp(48px,5vw,88px)/.85 var(--disp);font-stretch:62%}
.exp{margin-top:56px}
.exp div{display:grid;grid-template-columns:150px 1fr 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line);align-items:baseline}
.exp b{font:800 22px/1.1 var(--disp);font-stretch:100%;text-transform:uppercase}
.caps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px;margin-top:clamp(40px,5vw,70px)}
.caps div{border-top:1px solid var(--ink);padding:16px 0 34px}
.caps h3{font:900 clamp(26px,2.4vw,38px)/.9 var(--disp);font-stretch:100%;text-transform:uppercase;margin:10px 0 12px}
.caps p{font-size:17px;color:#3d3a35}
.caps .mono:last-child{color:var(--mut);margin-top:12px}
#brands{background:var(--c2);overflow:hidden;padding:clamp(60px,8vw,120px) 0}
#brands .brow{display:flex;width:max-content;will-change:transform}
#brands .brow span{font:900 clamp(56px,9vw,150px)/.95 var(--disp);text-transform:uppercase;padding:0 .25em;white-space:nowrap}
#brands .brow span:nth-child(even){font-family:var(--ser);font-style:italic;font-weight:400;text-transform:none;font-stretch:100%}
#contact{background:var(--c1);padding:clamp(80px,10vw,150px) var(--pad) 40px;position:relative;overflow:hidden}
#contact .scrib{left:30vw;top:6vh;width:60vw;height:40vh}
.crow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-top:clamp(40px,5vw,70px);border-top:1px solid var(--ink);padding-top:16px}
.crow>div{grid-column:span 4}
.crow a,.crow strong{display:block;font:800 clamp(20px,2vw,32px)/1.15 var(--disp);font-stretch:90%;overflow-wrap:anywhere;margin-top:6px}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(60px,8vw,120px)}

/* menu + viewer */
.ov{position:fixed;inset:0;z-index:120;visibility:hidden;clip-path:inset(0 0 100% 0);transition:clip-path .8s var(--ease) .1s,visibility 0s .95s}
.ov.on{visibility:visible;clip-path:inset(0);transition:clip-path .8s var(--ease),visibility 0s}
#menu{background:var(--ink);color:var(--paper);overflow-y:auto;padding:90px var(--pad) 40px}
#menu ol{list-style:none;display:grid;gap:8px}
#menu li{border-top:1px solid rgba(241,238,231,.2);padding:14px 0;display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 20px}
#menu li>a{font:900 clamp(36px,5.6vw,92px)/.86 var(--disp);text-transform:uppercase;font-stretch:80%;transition:font-stretch .5s var(--ease),color .3s}
#menu li>a:hover{font-stretch:125%;color:var(--mc)}
#menu .sub{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 18px;color:rgba(241,238,231,.6)}
#menu .sub a:hover{color:var(--paper)}
.ovbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px var(--pad);z-index:2}
#viewer{background:#0b0b0b;color:var(--paper);display:flex;flex-direction:column}
.vstage{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.vstage::-webkit-scrollbar{display:none}
.vstage figure{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:70px var(--pad) 20px}
.vstage img{max-width:100%;max-height:calc(100vh - 170px);object-fit:contain}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px var(--pad) 22px;border-top:1px solid rgba(241,238,231,.15)}
.vfoot .vt{font-style:italic;font-size:20px}

@media(max-width:900px){
 .chap{display:none}.hr .hide-m{display:none}
 .hmeta{grid-template-columns:1fr}.hmeta .mono{order:2}
 .ptop,.pmeta,.pbody,.agrid,.crow{grid-template-columns:minmax(0,1fr)}
 .pno,.pname,.pmeta div,.ptext,.pfig,.aphoto,.atext,.crow>div,.proj:nth-of-type(even) .ptext,.proj:nth-of-type(even) .pfig{grid-column:1/-1!important;grid-row:auto!important}
 .pmeta{grid-template-columns:repeat(2,minmax(0,1fr))}.pmeta div{grid-column:span 1!important}
 .ptext{position:relative;top:0}.pfig{margin-top:30px}
 .caps{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
 .exp div{grid-template-columns:1fr}.aphoto{max-width:420px}
 .cap{right:auto;left:var(--pad);top:auto;bottom:70px;transform:translateY(24px)}.cap.on{transform:none}
 .slide::after{background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.65))}
 #unrel-film{height:auto}#unrel-film .stick{position:relative;height:auto;padding:90px 0}
 .film{width:auto;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.film::-webkit-scrollbar{display:none}
 .film figure{width:84vw;scroll-snap-align:start}.film figure:last-child{margin-right:var(--pad)}
 #menu li{grid-template-columns:minmax(0,1fr)}#menu .sub{grid-column:1}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}.rv{opacity:1;transform:none}.pfig figure img{transform:none}}
</style>
</head>
<body>
<div id="loader" aria-hidden="true"><svg class="scrib" id="lscrib" viewBox="0 0 600 260"></svg><span class="mono">Opening the archive…</span><p>A portfolio in four chapters, by Kevin Anrico.</p></div>

<header class="hdr" id="hdr">
  <div class="hl"><a href="#top" class="logo">Kevin Anrico</a><div class="chap mono" id="chap"><div>Prologue</div><div>The work, in chapters</div></div></div>
  <div class="hr"><a class="br hide-m" href="../"><span>Classic view</span></a><a class="br hide-m" href="#contact"><span>Contact</span></a><button class="br" id="menuBtn" aria-expanded="false" aria-controls="menu"><span>Menu</span></button></div>
</header>
<div class="prog"><i id="prog"></i></div>

<main id="main">
  <section class="pin" id="hero" data-chap="Prologue|The work, in chapters" data-hc="#111">
    <div class="stick" id="top">
      <svg class="scrib" id="hscrib" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="hmeta"><span class="br">Scroll for story</span><p id="hintro"></p></div>
      <h1 class="disp htitle" aria-label="Kevin Anrico"><span class="fit" data-fit>Kevin</span><span class="fit" data-fit>Anrico</span></h1>
    </div>
  </section>
  <section class="pin" id="story" data-chap="Prologue|An art director in Jakarta" data-hc="#fff">
    <div class="stick" id="slides"></div>
  </section>
  <div id="chapters"></div>
  <section id="about" class="ep" data-chap="Epilogue|About" data-hc="#111"></section>
  <section id="brands" data-chap="Epilogue|Brands" data-hc="#111" aria-label="Brands worked with">
    <div class="mono" style="padding:0 var(--pad) 26px;display:flex;justify-content:space-between"><span>Brands I’ve worked with</span><span id="bcount"></span></div>
    <div class="brow" id="brow"></div>
  </section>
  <section id="contact" data-chap="Epilogue|Contact" data-hc="#111">
    <svg class="scrib" id="cscrib" viewBox="0 0 1000 400" preserveAspectRatio="none" aria-hidden="true"></svg>
    <p class="mono">Get in touch</p>
    <h2 class="disp" style="margin-top:28px;position:relative"><span class="fit" data-fit>Let’s work</span><span class="fit" data-fit>together</span></h2>
    <div class="crow" id="crow"></div>
    <div class="foot mono"><span>© 2026 Kevin Anrico</span><a href="../">Classic view ↗</a><a href="#top">Back to top ↑</a></div>
  </section>
</main>

<div class="ov" id="menu" aria-hidden="true">
  <div class="ovbar"><a href="#top" class="logo" data-close>Kevin Anrico</a><button class="br" data-close><span>Close</span></button></div>
  <ol id="mlist"></ol>
</div>
<div class="ov" id="viewer" role="dialog" aria-modal="true" aria-label="Project viewer">
  <div class="ovbar"><span class="mono" id="vtitle"></span><button class="br" id="vclose"><span>Back to story</span></button></div>
  <div class="vstage" id="vstage"></div>
  <div class="vfoot"><button class="br" id="vprev"><span>Prev</span></button><span class="vt" id="vcap"></span><span class="mono" id="vcount"></span><button class="br" id="vnext"><span>Next</span></button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const im=p=>'../'+String(p||'').replace(/^\/+/,'');
const ROM=['I','II','III','IV','V'];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

/* hand-drawn scribble generator */
function scribble(svg,{w,h,n=14,seed=1}){let s=seed;const r=()=>(s=(s*9301+49297)%233280)/233280;
 let x=w*.05,y=h*(.4+r()*.3),d=`M${x.toFixed(1)} ${y.toFixed(1)}`;
 for(let i=0;i<n;i++){const nx=w*(.05+.9*(i+1)/n)+(r()-.5)*w*.08,ny=h*(.15+r()*.75);
  d+=` C${(x+(r()-.3)*w*.18).toFixed(1)} ${(y-(r()*h*.7)).toFixed(1)},${(nx-(r()-.3)*w*.18).toFixed(1)} ${(ny+(r()*h*.6)).toFixed(1)},${nx.toFixed(1)} ${ny.toFixed(1)}`;
  if(r()>.6){const lx=nx+(r()-.5)*w*.06,ly=ny-r()*h*.3;d+=` Q${(nx+w*.04).toFixed(1)} ${(ly-h*.1).toFixed(1)},${lx.toFixed(1)} ${ly.toFixed(1)} T${nx.toFixed(1)} ${ny.toFixed(1)}`}
  x=nx;y=ny}
 svg.innerHTML=`<path d="${d}"/>`;const p=svg.firstChild,L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;return {p,L}}
const drawTo=(sc,k)=>{if(sc)sc.p.style.strokeDashoffset=sc.L*(1-clamp(k))};

/* loader */
const ls=scribble($('#lscrib'),{w:600,h:260,n:10,seed:7});let lt0=performance.now();
(function lf(t){const k=(t-lt0)/1800;drawTo(ls,k);if(k<1&&!RM)requestAnimationFrame(lf)})(lt0);

/* fit giant type to its container width */
function fitAll(){$$('[data-fit]').forEach(el=>{const st=el.style.fontStretch;el.style.fontStretch='125%';el.style.fontSize='100px';const w=el.parentElement.clientWidth,sw=el.scrollWidth||1;const cap=(el.closest('#hero')?.34:el.closest('.chapter')?.27:.22)*innerHeight/.8;el.style.fontSize=Math.min(100*w/sw*.995,cap)+'px';el.style.fontStretch=st})}

function init(C){
 const P=(C.projects||[]);
 const CH=[
  {id:'campaigns',name:['Campaigns','Key visuals'],label:'Campaigns & key visuals',col:'var(--c1)',hex:'#FF6A1F',test:p=>!/brand|ui|digital/i.test(p.category||''),line:'Above-the-line work, where one idea has to hold from billboard to feed.'},
  {id:'brands-livery',name:['Brand systems','& livery'],label:'Brand systems & livery',col:'var(--c2)',hex:'#2FA84F',test:p=>/brand/i.test(p.category||''),line:'Identities built to be seen at speed — on runways, roads and shelves.'},
  {id:'digital',name:['Digital','& UI'],label:'Digital & UI',col:'var(--c3)',hex:'#3B6CF6',test:p=>/ui|digital/i.test(p.category||''),line:'Where the brand becomes something people use, not just look at.'}];
 CH.forEach(c=>c.items=P.filter(c.test));
 const chs=CH.filter(c=>c.items.length);
 const H=C.hero||{},A=C.about||{},K=C.contact||{};
 $('#hintro').textContent=H.intro||'';

 /* prologue */
 const story=(C.story&&C.story.length?C.story:[
  {image:'img/pelita_photo2.webp',text:'I’m Kevin Anrico, an Art Director based in Jakarta.'},
  {image:'img/p09_134.webp',text:'For eight years I’ve helped brands find the one idea worth saying —'},
  {image:'img/p11_171.webp',text:'then made it impossible to miss, on billboards, aircraft and the phone in your hand.'},
  {image:'img/p07_93.webp',text:'Every project starts the same way: with a story.'},
  {image:'img/p24_383.webp',text:'This is the work, told chapter by chapter.'}]);
 $('#story').style.height=(story.length*90+60)+'vh';
 $('#slides').innerHTML=story.map((s,i)=>`<div class="slide${i?'':' on'}"><img src="${im(esc(s.image))}" alt=""></div>`).join('')+story.map((s,i)=>`<p class="cap${i?'':' on'}">${esc(s.text)}</p>`).join('')+`<div class="dots">${story.map((s,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`;

 /* chapters */
 let n=0;const all=[];
 $('#chapters').innerHTML=chs.map((c,ci)=>{
  const op=`<section class="pin chapter" id="${c.id}" style="--cc:${c.col}" data-chap="Chapter ${ROM[ci]}|${esc(c.label)}" data-hc="#111">
   <div class="stick"><svg class="scrib" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true" data-seed="${ci*5+3}"></svg>
   <h2 class="disp ctitle">${c.name.map(w=>`<span class="fit" data-fit data-stretch>${esc(w)}</span>`).join('')}</h2>
   <div class="clabel mono"><span>Chapter ${ROM[ci]}</span><span style="max-width:340px;text-transform:none;font:italic 400 19px/1.3 var(--ser);letter-spacing:0">${esc(c.line)}</span></div>
   <div class="count mono">${c.items.length} ${c.items.length>1?'projects':'project'}</div></div></section>`;
  const ps=c.items.map(p=>{n++;all.push(p);const g=(p.gallery||[]).length?p.gallery:[p.cover];const cut=/_cutout/.test(p.cover);
   const th=g.slice(0,3).map((x,i)=>`<button data-v="${esc(p.slug)}" data-i="${i}" aria-label="Open image ${i+1}"><img src="${im(esc(x))}" alt="" loading="lazy">${i===2&&g.length>3?`<span class="more mono">+${g.length-3} more</span>`:''}</button>`).join('');
   return `<article class="proj" id="p-${esc(p.slug)}" style="--cc:${c.col}" data-chap="Chapter ${ROM[ci]}|${esc(p.client)}" data-hc="#111">
    <div class="ptop rv"><div class="pno">${String(n).padStart(2,'0')}</div><h3 class="pname">${esc(p.client)}</h3></div>
    <div class="pmeta mono rv"><div><span>Sector</span>${esc(p.sector)}</div><div><span>Role</span>${esc(p.role)}</div><div><span>Scope</span>${esc(p.scope)}</div><div><span>Works</span>${g.length} ${g.length>1?'pieces':'piece'}</div></div>
    <div class="pbody"><div class="ptext rv"><p class="ptag">${esc(p.tagline)}</p><p class="drop">${esc(p.description)}</p><button class="br" data-v="${esc(p.slug)}" data-i="0"><span>Explore the work</span></button></div>
    <div class="pfig rv"><figure class="${cut?'clear':''}" data-v="${esc(p.slug)}" data-i="-1"><img src="${im(esc(p.cover))}" alt="${esc(p.client)} — ${esc(p.headline)}" loading="lazy"></figure>
    <div class="figcap mono"><span>Fig. ${String(n).padStart(2,'0')} — ${esc(p.headline)}</span><span>${esc(p.client)}</span></div>
    ${g.length&&!(g.length===1&&g[0]===p.cover)?`<div class="thumbs">${th}</div>`:''}</div></div></article>`}).join('');
  return op+ps}).join('')
 +(C.unreleased&&C.unreleased.length?`<section class="pin chapter dark" id="unreleased" style="--cc:var(--c4)" data-chap="Chapter ${ROM[chs.length]}|Unreleased" data-hc="#F1EEE7">
   <div class="stick"><svg class="scrib" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true" data-seed="29"></svg>
   <h2 class="disp ctitle"><span class="fit" data-fit data-stretch>Unreleased</span><span class="fit" data-fit data-stretch>key visuals</span></h2>
   <div class="clabel mono"><span>Chapter ${ROM[chs.length]}</span><span style="max-width:340px;text-transform:none;font:italic 400 19px/1.3 var(--ser);letter-spacing:0">Work that hasn’t gone public — yet.</span></div><div class="count mono">${C.unreleased.length} pieces</div></div></section>
   <section class="pin" id="unrel-film" data-chap="Chapter ${ROM[chs.length]}|Unreleased" data-hc="#F1EEE7"><div class="stick"><div class="fhead"><span class="mono">Scroll to drive through</span><p>Fresh tyres, never raced in public.</p></div><div class="film" id="film">${C.unreleased.map((u,i)=>`<figure data-v="__unrel" data-i="${i}"><img src="${im(esc(u))}" alt="Unreleased key visual ${i+1}" loading="lazy"><figcaption class="mono"><span>Unreleased</span><span>${String(i+1).padStart(2,'0')} / ${C.unreleased.length}</span></figcaption></figure>`).join('')}</div></div></section>`:'');
 $$('.chapter .scrib').forEach(s=>s._sc=scribble(s,{w:1000,h:300,n:12,seed:+s.dataset.seed||3}));

 /* about + caps */
 const stats=(A.stats||[]).map(s=>`<div><b>${esc(s.value)}${esc(s.suffix)}</b><span class="mono">${esc(s.label)}</span></div>`).join('');
 $('#about').innerHTML=`<div class="agrid"><div class="aphoto rv"><img src="${im(esc(A.photo))}" alt="Portrait of Kevin Anrico" loading="lazy"><p class="mono" style="margin-top:10px;color:var(--mut)">Kevin Anrico, Jakarta</p></div>
  <div class="atext"><p class="mono rv">Epilogue — About</p><p class="big rv" style="margin-top:20px">${esc(A.statement)} <em>${esc(A.statement_italic)}</em></p><p class="rv" style="margin-top:28px;color:#3d3a35;max-width:620px">${esc(A.bio)}</p>
  <div class="facts rv">${stats}</div>
  <div class="exp rv"><p class="mono">Experience</p>${(C.experience||[]).map(e=>`<div><span class="mono">${esc(e.years)}</span><b>${esc(e.company)}</b><span>${esc(e.role)}</span></div>`).join('')}</div></div></div>
  <div style="margin-top:clamp(70px,9vw,140px)"><p class="mono rv">What I bring</p><p class="big rv" style="margin-top:16px;max-width:900px">${esc(C.capabilities_intro)}</p>
  <div class="caps">${(C.capabilities||[]).map((c,i)=>`<div class="rv"><span class="mono">${String(i+1).padStart(2,'0')}</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p>${c.examples?`<p class="mono">Seen in — ${esc(c.examples)}</p>`:''}</div>`).join('')}</div></div>`;
 const B=(C.clients||[]).map(esc);$('#bcount').textContent=B.length+' brands';
 const bh=B.map(b=>`<span>${b}</span>`).join('');$('#brow').innerHTML=bh+bh;
 const tel=String(K.phone||'').replace(/[^0-9+]/g,'');
 $('#crow').innerHTML=`<div><span class="mono">Email</span><a href="mailto:${esc(K.email)}">${esc(K.email)}</a></div><div><span class="mono">Phone / WhatsApp</span><a href="tel:${tel}">${esc(K.phone)}</a></div><div><span class="mono">Based in</span><strong>${esc(K.location)}</strong></div>`;

 /* menu */
 $('#mlist').innerHTML=`<li style="--mc:#FF6A1F"><span class="mono">Prologue</span><a href="#story" data-close>The story</a></li>`+chs.map((c,ci)=>`<li style="--mc:${c.hex}"><span class="mono">Ch. ${ROM[ci]}</span><a href="#${c.id}" data-close>${esc(c.label)}</a><div class="sub mono">${c.items.map(p=>`<a href="#p-${esc(p.slug)}" data-close>${esc(p.client)}</a>`).join('')}</div></li>`).join('')
  +(C.unreleased&&C.unreleased.length?`<li style="--mc:#F1EEE7"><span class="mono">Ch. ${ROM[chs.length]}</span><a href="#unreleased" data-close>Unreleased</a></li>`:'')
  +`<li style="--mc:#2FA84F"><span class="mono">Epilogue</span><a href="#about" data-close>About & contact</a><div class="sub mono"><a href="#about" data-close>About</a><a href="#brands" data-close>Brands</a><a href="#contact" data-close>Contact</a><a href="../">Classic view ↗</a></div></li>`;

 /* scroll engine */
 let lenis=null;if(!RM&&window.Lenis){try{lenis=new Lenis({lerp:.1})}catch(e){}}
 const go=h=>{const t=document.getElementById(h);if(!t)return;lenis?lenis.scrollTo(t,{offset:0}):t.scrollIntoView({behavior:RM?'auto':'smooth'})};
 document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href').slice(1);if(!h||!document.getElementById(h))return;e.preventDefault();if(a.hasAttribute('data-close'))closeOv($('#menu'));setTimeout(()=>go(h),a.hasAttribute('data-close')?400:0)});

 /* overlays */
 const mBtn=$('#menuBtn'),menu=$('#menu'),vw=$('#viewer');
 function openOv(o){o.classList.add('on');o.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden';lenis&&lenis.stop();if(o===menu)mBtn.setAttribute('aria-expanded','true')}
 function closeOv(o){o.classList.remove('on');o.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';lenis&&lenis.start();if(o===menu)mBtn.setAttribute('aria-expanded','false')}
 mBtn.onclick=()=>openOv(menu);menu.querySelectorAll('button[data-close]').forEach(b=>b.onclick=()=>closeOv(menu));
 let vItems=[],vIdx=0;
 function openViewer(slug,i){let items,title;if(slug==='__unrel'){items=C.unreleased.map(u=>({src:u,cap:'Unreleased key visual'}));title='Unreleased'}else{const p=P.find(x=>x.slug===slug);if(!p)return;const g=(p.gallery||[]).length?p.gallery:[p.cover];items=(i<0?[p.cover,...g.filter(x=>x!==p.cover)]:g).map(s=>({src:s,cap:p.headline}));title=p.client;if(i<0)i=0}
  vItems=items;$('#vtitle').textContent=title;$('#vstage').innerHTML=items.map(x=>`<figure><img src="${im(esc(x.src))}" alt=""></figure>`).join('');openOv(vw);requestAnimationFrame(()=>vTo(i,false))}
 function vTo(i,sm=true){vIdx=(i+vItems.length)%vItems.length;const st=$('#vstage');st.scrollTo({left:st.clientWidth*vIdx,behavior:sm&&!RM?'smooth':'auto'});vLabel()}
 function vLabel(){$('#vcount').textContent=`${String(vIdx+1).padStart(2,'0')} / ${String(vItems.length).padStart(2,'0')}`;$('#vcap').textContent=vItems[vIdx]?.cap||''}
 $('#vstage').addEventListener('scroll',()=>{const st=$('#vstage'),i=Math.round(st.scrollLeft/st.clientWidth);if(i!==vIdx){vIdx=i;vLabel()}},{passive:true});
 $('#vprev').onclick=()=>vTo(vIdx-1);$('#vnext').onclick=()=>vTo(vIdx+1);$('#vclose').onclick=()=>closeOv(vw);
 document.addEventListener('click',e=>{const t=e.target.closest('[data-v]');if(t)openViewer(t.dataset.v,+t.dataset.i)});
 addEventListener('keydown',e=>{if(e.key==='Escape'){if(vw.classList.contains('on'))closeOv(vw);else if(menu.classList.contains('on'))closeOv(menu)}if(vw.classList.contains('on')){if(e.key==='ArrowRight')vTo(vIdx+1);if(e.key==='ArrowLeft')vTo(vIdx-1)}});

 /* reveals */
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');x.target.querySelector?.('figure')?.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
 $$('.rv').forEach(x=>io.observe(x));

 /* sizing */
 const hs=scribble($('#hscrib'),{w:1000,h:300,n:16,seed:11}),cs=scribble($('#cscrib'),{w:1000,h:400,n:12,seed:19});
 const film=$('#film'),filmSec=$('#unrel-film');
 function size(){fitAll();if(filmSec&&innerWidth>900)filmSec.style.setProperty('--fh',(film.scrollWidth-innerWidth+innerHeight)+'px')}
 size();addEventListener('resize',size);document.fonts&&document.fonts.ready.then(size);addEventListener('load',size);

 const hmeta=$('.hmeta'),pins=$$('[data-chap]'),hdr=$('#hdr'),chap=$('#chap'),prog=$('#prog'),hero=$('#hero'),story_=$('#story'),slides=$$('#slides .slide'),caps=$$('#slides .cap'),dots=$$('#slides .dots i'),brow=$('#brow'),contact=$('#contact');
 let cur='',bx=0,lastY=scrollY;
 const pk=el=>{const r=el.getBoundingClientRect();return clamp(-r.top/Math.max(1,r.height-innerHeight))};
 function frame(t){lenis&&lenis.raf(t);const y=scrollY,dy=y-lastY;lastY=y;
  const H2=document.documentElement.scrollHeight-innerHeight;prog.style.transform=`scaleX(${H2>0?y/H2:0})`;
  // which section owns the header
  let own=pins[0];for(const s of pins){const r=s.getBoundingClientRect();if(r.top<=70&&r.bottom>70)own=s}
  if(own.dataset.chap!==cur){cur=own.dataset.chap;const [a,b]=cur.split('|');chap.innerHTML=`<div>${esc(a)}</div><div>${esc(b)}</div>`;hdr.style.setProperty('--hc',own.dataset.hc||'#111');prog.parentElement.style.setProperty('--hc',own.dataset.hc||'#111')}
  if(!RM){
   const hp=pk(hero);drawTo(hs,.15+hp*1.6);hmeta.style.opacity=1-clamp(hp*3);$$('#hero [data-fit]').forEach((el,i)=>{el.style.fontStretch=(125-hp*60)+'%';el.style.transform=`translateY(${-hp*10}vh)`});
   const sp=pk(story_),si=Math.min(slides.length-1,Math.floor(sp*slides.length*.999));slides.forEach((s,i)=>s.classList.toggle('on',i===si));caps.forEach((s,i)=>s.classList.toggle('on',i===si));dots.forEach((s,i)=>s.classList.toggle('on',i<=si));
   $$('.chapter').forEach(c=>{const r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const k=pk(c),e=1-Math.pow(1-clamp(k*1.6),3);
    c.querySelectorAll('[data-stretch]').forEach((el,i)=>{el.style.fontStretch=(62+e*63)+'%';el.style.transform=`translateY(${(1-e)*(i?14:7)}vh)`});drawTo(c.querySelector('.scrib')?._sc,k*1.4)});
   if(filmSec&&innerWidth>900){const r=filmSec.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0){const m=film.scrollWidth-innerWidth;film.style.transform=`translate3d(${-pk(filmSec)*m}px,0,0)`}}
   const w=brow.scrollWidth/2;if(w){bx-=1+Math.min(Math.abs(dy)*.25,8);bx=((bx%w)-w)%w;brow.style.transform=`translate3d(${bx}px,0,0)`}
   const cr=contact.getBoundingClientRect();drawTo(cs,clamp((innerHeight-cr.top)/(innerHeight*1.1)));
  }else{drawTo(hs,1);drawTo(cs,1);$$('.chapter .scrib').forEach(s=>drawTo(s._sc,1))}
  requestAnimationFrame(frame)}
 requestAnimationFrame(frame);

 /* deep link */
 if(location.hash&&document.getElementById(location.hash.slice(1)))setTimeout(()=>go(location.hash.slice(1)),300);
 /* reveal page */
 setTimeout(()=>{$('#loader').classList.add('out');setTimeout(()=>$('#loader').remove(),1200)},RM?0:1900);
}
fetch('../content.json',{cache:'no-cache'}).then(r=>r.json()).then(init).catch(e=>{console.error(e);$('#loader').innerHTML='<p>Content could not load.</p>'});
}
</script>
</body>
</html>
